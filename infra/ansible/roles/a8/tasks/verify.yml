---
# Доказова частина ролі. Запускається окремо:
#   ansible-playbook a8.yml -i inventory.a8.ini --tags verify
#
# ЩО ЦЕЙ ФАЙЛ ДОВОДИТЬ І ЧОГО НЕ ДОВОДИТЬ — див. README §5. Коротко: тут
# переважно СТАН; ПОВЕДІНКУ міряють V5 (запобіжники справді відмовляють), V8c
# (журнал) і V6, V7, V10, V12, V13, які запускають справжній контейнер. Зелений
# verify не означає, що демон коректно бере задачу і віддає PR — такого демона
# ще немає.

# ─── V1. Користувач: без sudo, у групі docker ──────────────────────────────
- name: V1a — collect agent user groups
  ansible.builtin.command: "id -nG {{ a8_agent_user }}"
  register: a8_v_groups
  changed_when: false

- name: V1c — ask sudo itself what agent may run
  # Група — не єдиний шлях до sudo: правило в /etc/sudoers або sudoers.d дає
  # права без членства в `sudo`. Питаємо сам sudo, а не список груп.
  ansible.builtin.command: "sudo -n -l -U {{ a8_agent_user }}"
  register: a8_v_sudo
  changed_when: false
  failed_when: false

- name: V1b — agent is in docker group and NOT in sudo
  ansible.builtin.assert:
    that:
      - "'docker' in a8_v_groups.stdout.split()"
      - "'sudo' not in a8_v_groups.stdout.split()"
      - "'is not allowed to run sudo' in a8_v_sudo.stdout"
    fail_msg: >-
      Групи {{ a8_agent_user }}: {{ a8_v_groups.stdout }}.
      Очікується docker (docs/19 §B.1 — усвідомлений компроміс) і відсутність sudo.
    success_msg: "Групи: {{ a8_v_groups.stdout }} — docker є, sudo немає"
    quiet: true

# ─── V2. Розкладка тек ─────────────────────────────────────────────────────
- name: V2a — stat working directories
  ansible.builtin.stat:
    path: "{{ item }}"
  register: a8_v_dirs
  loop:
    - "{{ a8_repo_dir }}"
    - "{{ a8_worktrees_dir }}"
    - "{{ a8_logs_dir }}"
    - "{{ a8_queue_dir }}"
    - "{{ a8_container_home }}"

- name: V2b — directories exist and belong to the agent
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.pw_name == a8_agent_user
    fail_msg: "{{ item.item }}: exists={{ item.stat.exists | default(false) }}, owner={{ item.stat.pw_name | default('?') }}"
    quiet: true
  loop: "{{ a8_v_dirs.results }}"
  loop_control:
    label: "{{ item.item }}"

# ─── V3. Довіра Claude Code — саме на КОРІНЬ клону ─────────────────────────
- name: V3a — read Claude Code config
  ansible.builtin.slurp:
    src: "{{ a8_agent_home }}/.claude.json"
  register: a8_v_claude
  failed_when: false

- name: V3b — main clone is marked trusted
  # Перевіряємо ключ саме кореня клону: виміряно (PR #110), що запис для теки
  # worktree не діє взагалі, тож «є якийсь запис» — недостатнє твердження.
  ansible.builtin.assert:
    that:
      - a8_v_claude.content is defined
      - ((a8_v_claude.content | b64decode | from_json).projects | default({}))[a8_repo_dir] is defined
      - ((a8_v_claude.content | b64decode | from_json).projects[a8_repo_dir].hasTrustDialogAccepted | default(false)) | bool
    fail_msg: >-
      У {{ a8_agent_home }}/.claude.json немає hasTrustDialogAccepted=true для {{ a8_repo_dir }}.
      Наслідок: allow-список буде мовчки відкинуто рядком «this workspace has not been trusted».
    quiet: true

# ─── V4. Kill switch: механізм є, файла немає ──────────────────────────────
- name: V4a — stat guard script and kill switch
  ansible.builtin.stat:
    path: "{{ item }}"
  register: a8_v_guard
  loop:
    - /usr/local/bin/a8-guard
    - "{{ a8_config_dir }}/a8.env"
    - "{{ a8_kill_switch_path }}"

- name: V4b — guard exists, kill switch absent
  ansible.builtin.assert:
    that:
      - a8_v_guard.results[0].stat.exists and a8_v_guard.results[0].stat.executable
      - a8_v_guard.results[1].stat.exists
      - not a8_v_guard.results[2].stat.exists
    fail_msg: >-
      guard={{ a8_v_guard.results[0].stat.exists }}, config={{ a8_v_guard.results[1].stat.exists }},
      kill switch присутній={{ a8_v_guard.results[2].stat.exists }} (має бути false — інакше черга стоїть).
    quiet: true

# ─── V5. Guard справді відмовляє — поведінкова перевірка ───────────────────
- name: V5a — run guard with a simulated kill switch
  # Не просто «скрипт існує», а «скрипт РОБИТЬ те, заради чого існує»:
  # підкладаємо kill switch у тимчасовий конфіг і чекаємо на код 10.
  ansible.builtin.shell: |
    set -o pipefail
    tmp=$(mktemp -d)
    touch "$tmp/STOP"
    sed "s|^A8_KILL_SWITCH=.*|A8_KILL_SWITCH=$tmp/STOP|" {{ a8_config_dir }}/a8.env > "$tmp/a8.env"
    sed "s|{{ a8_config_dir }}/a8.env|$tmp/a8.env|" /usr/local/bin/a8-guard > "$tmp/guard"
    chmod +x "$tmp/guard"
    "$tmp/guard" check >/dev/null 2>&1
    echo "exit=$?"
    rm -rf "$tmp"
  register: a8_v_guard_behaviour
  changed_when: false

- name: V5b — guard returns 10 when the kill switch is present
  ansible.builtin.assert:
    that:
      - "'exit=10' in a8_v_guard_behaviour.stdout"
    fail_msg: "a8-guard при наявному kill switch повернув {{ a8_v_guard_behaviour.stdout }}, очікувалось exit=10"
    success_msg: "a8-guard відмовляє при kill switch (exit=10)"
    quiet: true

# ─── V5c/V5d. Два інших запобіжники теж мусять СПРАЦЬОВУВАТИ ───────────────
# Додано після рев'ю: V4 доводив лише наявність конфіга, тож денний ліміт і
# пауза після трьох падінь могли бути зламані при зеленому verify. Запобіжник,
# який ніхто не перевіряє на спрацювання, — це той самий клас «код + тест,
# 0 викликів у пайплайні», проти якого написаний CLAUDE.md §0 п.6.
- name: V5c — run guard against an exhausted daily limit
  ansible.builtin.shell: |
    set -o pipefail
    tmp=$(mktemp -d); mkdir -p "$tmp/logs"
    sed -e "s|^A8_KILL_SWITCH=.*|A8_KILL_SWITCH=$tmp/NOPE|" \
        -e "s|^A8_LOGS_DIR=.*|A8_LOGS_DIR=$tmp/logs|" \
        -e "s|^A8_DAILY_TASK_LIMIT=.*|A8_DAILY_TASK_LIMIT=2|" \
        {{ a8_config_dir }}/a8.env > "$tmp/a8.env"
    echo 2 > "$tmp/logs/counter-$(date -u +%Y-%m-%d)"
    sed "s|{{ a8_config_dir }}/a8.env|$tmp/a8.env|" /usr/local/bin/a8-guard > "$tmp/guard"
    chmod +x "$tmp/guard"; "$tmp/guard" check >/dev/null 2>&1; echo "limit_exit=$?"
    printf 'failed\nfailed\nfailed\n' > "$tmp/logs/last-results"
    echo 0 > "$tmp/logs/counter-$(date -u +%Y-%m-%d)"
    "$tmp/guard" check >/dev/null 2>&1; echo "fail_exit=$?"
    printf 'failed\nfailed\nok\n' > "$tmp/logs/last-results"
    "$tmp/guard" check >/dev/null 2>&1; echo "recovered_exit=$?"
    # Звіт guard'а про себе мусить збігатися з тим, що він порахував. Раніше в
    # повідомленні стояв вписаний «0»: при `failed ok failed failed` guard
    # правильно НЕ ставив паузу, але друкував «падінь поспіль 0», і живий
    # розбір 2026-09-20 зробив із цього хибний висновок. Тут стан свідомо
    # такий, де відповідь не 0 і не дорівнює ліміту: 2 з 3.
    printf 'ok\nfailed\nfailed\n' > "$tmp/logs/last-results"
    # Без підстановки команди: рядок виду `echo "x=$("$q" … | sed …)"` валить
    # ansible-lint (`parser-error: failed at splitting arguments`) — bash його
    # розуміє, парсер лінта ні. Пишемо у файл і дістаємо sed'ом окремою
    # командою; результат той самий, а розбір однозначний.
    "$tmp/guard" check > "$tmp/report" 2>&1
    sed -n 's/.*падінь поспіль /report=/p' "$tmp/report"
    # ПОСПІЛЬ = з кінця до першого не-`failed`. На `failed failed ok` вікно
    # давало 2, тоді як падінь поспіль нуль: успіх скинув лічильник. Саме це
    # число guard надрукував 2026-09-20 одразу після успішного прогону, і воно
    # прочиталось як «лишилось одне падіння до паузи».
    printf 'failed\nfailed\nok\n' > "$tmp/logs/last-results"
    "$tmp/guard" check > "$tmp/after-ok" 2>&1
    sed -n 's/.*падінь поспіль /after_ok=/p' "$tmp/after-ok"
    # Дієслово check-run гейтить лише ВИКОНАННЯ. Ані вичерпаний ліміт, ані
    # пауза його не стосуються: обгортка стартує контейнер, а не бере задачу,
    # і лічильник на цей момент уже інкрементовано демоном. Інакше оракул
    # приймання останньої дозволеної задачі дня падав би кодом 11.
    echo 2 > "$tmp/logs/counter-$(date -u +%Y-%m-%d)"
    printf 'failed\nfailed\nfailed\n' > "$tmp/logs/last-results"
    "$tmp/guard" check-run >/dev/null 2>&1; echo "run_exit=$?"
    # Kill switch — єдиний запобіжник, що зупиняє і виконання теж.
    touch "$tmp/NOPE"
    "$tmp/guard" check-run >/dev/null 2>&1; echo "run_stop_exit=$?"
    rm -rf "$tmp"
  register: a8_v_guard_limits
  changed_when: false

- name: V5d — daily limit returns 11, three failures return 12, recovery returns 0
  # Третій рядок — контроль: без нього перевірка не відрізняє «спрацював на
  # трьох падіннях» від «завжди відмовляє».
  ansible.builtin.assert:
    that:
      - "'limit_exit=11' in a8_v_guard_limits.stdout"
      - "'fail_exit=12' in a8_v_guard_limits.stdout"
      - "'recovered_exit=0' in a8_v_guard_limits.stdout"
      # Guard мусить звітувати ПОРАХОВАНЕ число, а не літерал. Стан `ok failed
      # failed` при ліміті 3 → паузи немає, але падінь поспіль рівно два.
      # Вписаний «0» цю перевірку не пройде.
      - "'report=2 з 3' in a8_v_guard_limits.stdout"
      # Пара до попереднього рядка: ті самі три результати в іншому порядку.
      # Вікно дало б 2, підрахунок поспіль дає 0. Без ЦІЄЇ пари перевірка не
      # відрізняє «рахує поспіль» від «рахує у вікні».
      - "'after_ok=0 з 3' in a8_v_guard_limits.stdout"
      # Два дієслова: check гейтить набір задачі, check-run — лише виконання.
      - "'run_exit=0' in a8_v_guard_limits.stdout"
      - "'run_stop_exit=10' in a8_v_guard_limits.stdout"
    fail_msg: "a8-guard: {{ a8_v_guard_limits.stdout | replace('\n', ' ') }}"
    success_msg: "a8-guard: ліміт → 11, три падіння → 12, після успіху → 0, падіння рахуються поспіль, check-run гейтить лише kill switch"
    quiet: true

# ─── V6. Контейнер стартує під правильним UID і з записуваним $HOME ────────
- name: V6a — run container through the wrapper
  # ЖОДНОЇ shell-змінної у зонді. `$HOME` тут розкривався десь у шарах між
  # Ansible і контейнером — під `agent` виходило `/home/agent` замість
  # `/home/agent/container-home`, і зонд падав, хоча середовище було справне.
  # Перехід на `argv:` цього НЕ виправив (перевірено 2026-09-19, PR #120), тож
  # правильна відповідь — не з'ясовувати, який шар винен, а прибрати змінну.
  #
  # Три незалежні виміри того дня, усі через ту саму обгортку:
  #   a8-run-agent … printenv HOME            → /home/agent/container-home
  #   a8-run-agent … bash -c printenv         → /home/agent/container-home
  #   a8-run-agent … bash <файл із $HOME>     → /home/agent/container-home + запис
  # Тобто контейнер, bash і тека справні; ламався лише текст зонда.
  #
  # `printenv HOME` читає змінну БЕЗ `$`, тож значення приходить із контейнера,
  # а не з підстановки. Запис пробуємо у `{{ a8_container_home }}` — Jinja
  # підставляє літерал ще до будь-якого shell. V6b звіряє одне з одним: HOME
  # контейнера мусить дорівнювати налаштованому шляху, і саме той шлях мусить
  # бути записуваним. Поодинці кожна з двох перевірок нічого не варта.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - bash
      - -c
      - |
        id -u
        printenv HOME
        touch "{{ a8_container_home }}/.a8probe" && echo HOME_WRITABLE && rm -f "{{ a8_container_home }}/.a8probe"
        test -t 0 && echo TTY || echo NO_TTY
        test -S /var/run/docker.sock && echo DOCKER_SOCK || echo NO_DOCKER_SOCK
  register: a8_v_container
  changed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V6b — UID matches the repo owner, HOME writable, no TTY
  # Три виміряні вимоги одним прогоном. NO_TTY — не косметика: саме
  # псевдотермінал дає push зависнути замість впасти (вимір №7, B3 → exit 124).
  ansible.builtin.assert:
    that:
      - a8_v_container.stdout_lines[0] | int == a8_container_uid
      # Друга умова без першої була б порожньою: «щось записуване» ще не
      # означає, що агент писатиме саме туди. Разом вони кажуть, що HOME
      # контейнера — це налаштована тека, і що вона записувана.
      - a8_v_container.stdout_lines[1] == a8_container_home
      - "'HOME_WRITABLE' in a8_v_container.stdout"
      - "'NO_TTY' in a8_v_container.stdout"
      # Група docker на хості = root (docs/19 §B.1). Ця межа тримається, доки
      # сокет docker НЕ змонтовано в контейнер: процес зі знятими підтвердженнями
      # не повинен мати шляху до root на хості. README §4-bis.
      - "'NO_DOCKER_SOCK' in a8_v_container.stdout"
    fail_msg: "Вивід контейнера: {{ a8_v_container.stdout }}"
    success_msg: "UID={{ a8_container_uid }}, HOME записуваний, термінала немає, docker-сокета немає"
    quiet: true

# ─── V7. git у контейнері працює на запис у worktree ───────────────────────
- name: V7a — git status inside the container
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - git
      - -C
      - "{{ a8_repo_dir }}"
      - status
      - --porcelain
  register: a8_v_git
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V7b — git does not fail with dubious ownership
  # Саме ця сигнатура вбивала прогони М-3 (вимір №6 §3.3). Перевіряємо не
  # «git є», а «git не відмовляє через невідповідність UID».
  ansible.builtin.assert:
    that:
      - a8_v_git.rc == 0
      - "'dubious ownership' not in (a8_v_git.stderr | default(''))"
    fail_msg: "git у контейнері: rc={{ a8_v_git.rc }}, stderr={{ a8_v_git.stderr | default('') }}"
    quiet: true

- name: V7c — resolve git identity inside the container
  # Додано після рев'ю: `git status` НЕ потребує identity, тож V7b залишався б
  # зеленим і після того, як з обгортки прибрали GIT_AUTHOR_*. `git var
  # GIT_AUTHOR_IDENT` натомість друкує саме той ident, з яким піде коміт.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - git
      - -C
      - "{{ a8_repo_dir }}"
      - var
      - GIT_AUTHOR_IDENT
  register: a8_v_ident
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V7d — identity is the one the wrapper passes, not an auto-detected guess
  ansible.builtin.assert:
    that:
      - a8_v_ident.rc == 0
      - a8_git_author_email in a8_v_ident.stdout
    fail_msg: >-
      git var GIT_AUTHOR_IDENT → rc={{ a8_v_ident.rc }}, '{{ a8_v_ident.stdout }}'.
      Очікувався {{ a8_git_author_email }}. Без явної identity commit падає 128
      'unable to auto-detect email address' (вимір №6 §3.1 крок 6).
    quiet: true

# ─── V8. Swap і ліміт логів docker ─────────────────────────────────────────
- name: V8a — collect swap, swappiness and docker config
  ansible.builtin.command: "{{ item }}"
  register: a8_v_sys
  changed_when: false
  loop:
    - swapon --show=NAME,SIZE --noheadings
    - cat /etc/docker/daemon.json
    - sysctl -n vm.swappiness

- name: V8b — swap active, swappiness lowered, docker log rotation configured
  # swappiness додано після рев'ю: без нього assertion зеленів на активному
  # swap із дефолтними 60, тобто доводив половину вимоги.
  ansible.builtin.assert:
    that:
      - a8_v_sys.results[0].stdout | length > 0
      - "'max-size' in a8_v_sys.results[1].stdout"
      - "'live-restore' in a8_v_sys.results[1].stdout"
      - a8_v_sys.results[2].stdout | trim | int == 10
    fail_msg: >-
      swap='{{ a8_v_sys.results[0].stdout }}', swappiness={{ a8_v_sys.results[2].stdout | trim }};
      daemon.json без max-size або без live-restore (останнє означало б, що шаблон зняв
      наявну опцію — регресія).
    quiet: true

# ─── V8c/V8d. Журнал: поля і fail closed з OQ-34 ──────────────────────────
- name: V8c — exercise the run journal
  # Додано після рев'ю: V2 доводив лише наявність теки, тож формат журналу і
  # fail-closed на полі `source` могли зламатись при зеленому verify. Пишемо в
  # тимчасову теку, не в робочий журнал.
  ansible.builtin.shell: |
    set -o pipefail
    tmp=$(mktemp -d); mkdir -p "$tmp/logs"
    sed "s|^A8_LOGS_DIR=.*|A8_LOGS_DIR=$tmp/logs|" {{ a8_config_dir }}/a8.env > "$tmp/a8.env"
    sed "s|{{ a8_config_dir }}/a8.env|$tmp/a8.env|" /usr/local/bin/a8-journal > "$tmp/journal"
    chmod +x "$tmp/journal"
    "$tmp/journal" append t1 human ok 42 opus "probe" >/dev/null 2>&1; echo "good_exit=$?"
    "$tmp/journal" append t2 whatever ok 42 opus >/dev/null 2>&1; echo "bad_source_exit=$?"
    "$tmp/journal" reject t3 "source:missing,oracle:missing" >/dev/null 2>&1
    echo "reject_fields=$(jq -c 'select(.event=="reject") | .fields' "$tmp/logs/runs.log")"
    echo "lines=$(grep -c '"event":"run"' "$tmp/logs/runs.log")"
    echo "fields=$(jq -r '[.ts,.task,.source,.result,.duration_s,.model] | length' "$tmp/logs/runs.log" | head -1)"
    rm -rf "$tmp"
  register: a8_v_journal
  changed_when: false

- name: V8d — journal writes six fields and fails closed on an unknown source
  ansible.builtin.assert:
    that:
      - "'good_exit=0' in a8_v_journal.stdout"
      - "'bad_source_exit=2' in a8_v_journal.stdout"
      - "'lines=1' in a8_v_journal.stdout" # відхилений запис НЕ потрапив у журнал
      - "'fields=6' in a8_v_journal.stdout"
      # Два fail closed — два різні «ні»: запис відмови називає КОЖНЕ поле.
      - '''reject_fields=["source:missing","oracle:missing"]'' in a8_v_journal.stdout'
    fail_msg: "a8-journal: {{ a8_v_journal.stdout | replace('\n', ' ') }}"
    success_msg: "a8-journal: валідний запис пройшов, source='whatever' відхилено (exit 2, OQ-34 fail closed)"
    quiet: true

# ─── V9. Egress-allowlist ──────────────────────────────────────────────────
- name: V9a — inspect ipset and timer
  # Третій блок — DNS-сервери, до яких реально ходить контейнер. Без них у наборі
  # примус відрізав би резолв повністю (виміряно на A8: /etc/resolv.conf — лише
  # стаб 127.0.0.53, контейнер отримує 192.168.1.1 з файлу systemd-resolved).
  ansible.builtin.shell: |
    set -o pipefail
    ipset list -n 2>/dev/null | grep -qx '{{ a8_egress_ipset }}' && echo SET_PRESENT || echo SET_MISSING
    systemctl is-enabled a8-egress-refresh.timer 2>/dev/null || true
    grep -E '^nameserver [0-9.]+$' /run/systemd/resolve/resolv.conf 2>/dev/null | awk '{print $2}' |
      while read -r ip; do
        ipset test '{{ a8_egress_ipset }}' "$ip" 2>/dev/null && echo "DNS_IN_SET $ip" || echo "DNS_MISSING $ip"
      done
  register: a8_v_egress
  changed_when: false
  when: a8_egress_enabled | bool

- name: V9b — allowlist set exists, refresh timer is enabled, container DNS is allowed
  ansible.builtin.assert:
    that:
      - "'SET_PRESENT' in a8_v_egress.stdout"
      - "'enabled' in a8_v_egress.stdout"
      - "'DNS_IN_SET' in a8_v_egress.stdout"
      - "'DNS_MISSING' not in a8_v_egress.stdout"
    fail_msg: "ipset/таймер/DNS: {{ a8_v_egress.stdout | replace('\n', ' ') }}"
    quiet: true
  when: a8_egress_enabled | bool

- name: V9c — report that enforcement is off by default
  ansible.builtin.debug:
    msg: >-
      ПРИМУС egress ВИМКНЕНО (a8_egress_enforce=false). Набір адрес наповнюється і його
      видно, але DROP усього іншого не застосовано. Це не дефект verify — це дефолт
      ролі: вмикати фільтр наосліп означає ризикнути тим, що демон тихо втратить
      мережу. Порядок увімкнення — README §6.
  when: (a8_egress_enabled | bool) and not (a8_egress_enforce | bool)

# ─── V10. lefthook досяжний у PATH контейнера ──────────────────────────────
- name: V10a — resolve lefthook inside the container
  # `-c`, НЕ `-lc`. Login-shell читає /etc/profile, а той перезадає PATH —
  # наш `-e PATH=…` з `node_modules/.bin` при цьому зникає. Виміряно парою
  # з контролем 2026-09-19, та сама обгортка, різниця в одному символі:
  #   bash -lc printenv → PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/games:…
  #   bash -c  printenv → PATH=/home/agent/hart/node_modules/.bin:/usr/local/sbin:…
  # Через це V10 падала при цілком справному середовищі: lefthook лежав на
  # місці, але зонд дивився в інший PATH. Демон цим не зачеплений — він кличе
  # `bash tools/scripts/check-hook-loud.sh`, без `-l`.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - bash
      - -c
      - command -v lefthook
  register: a8_v_lefthook
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V10b — lefthook is on PATH
  # Вимір №7: без цього pre-commit — ТИХИЙ no-op (хук виконується, бінарника
  # немає, коміт проходить з exit 0). МЕЖА: перевірка доводить досяжність
  # бінарника, а НЕ те, що хук блокує поганий коміт — це потребує мутації репо
  # і робиться на рівні демона, не тут (README §5).
  ansible.builtin.assert:
    that:
      - a8_v_lefthook.rc == 0
      - a8_v_lefthook.stdout | length > 0
    fail_msg: >-
      lefthook не знайдено в PATH контейнера (rc={{ a8_v_lefthook.rc }}).
      Наслідок: pre-commit у контейнері не перевіряє ні ESLint, ні tsc, ні prettier, ні ruff,
      і виглядає це як робочий захист. Перевір у такому порядку:
      (1) чи справді бракує бінарника — `ls {{ a8_repo_dir }}/node_modules/.bin/lefthook`;
      (2) якщо він там є, дивись на PATH самого контейнера —
      `a8-run-agent {{ a8_repo_dir }} bash -c printenv | grep ^PATH=`.
      Другий випадок уже траплявся: login-shell перезадавав PATH і зонд шукав не там.
    quiet: true

# ─── V12. Заборонені шляхи змонтовані read-only — і записуваний контроль ────
- name: V12a — try to write into read-only and writable paths inside the container
  # Поведінка, не наявність прапорця в скрипті: пробуємо писати. Контроль —
  # запис у домівку контейнера мусить пройти, інакше «EROFS скрізь» не
  # відрізнялось би від «зламаного монтування взагалі».
  #
  # ЖОДНОЇ shell-змінної, як і у V6a, і тут ціна вища за хибне падіння. `$p`
  # була змінною циклу: якби її з'їв проміжний шар (а `$HOME` у V6a саме так і
  # зникав), зонд перевіряв би `{{ a8_repo_dir }}/` замість заборонених шляхів
  # і бадьоро звітував би результат, який ні про що не говорить. Тихий хибний
  # «успіх» гірший за падіння — саме так інваріант стає декорацією.
  #
  # Тому цикл розгортає Jinja: кожен шлях стає окремим літералом ЩЕ ДО того, як
  # текст побачить будь-який shell. Список довгим не буде — це перелік
  # заборонених зон, а не дані.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - bash
      - -c
      - |
        {% for p in a8_ro_paths %}
        if [ ! -e "{{ a8_repo_dir }}/{{ p }}" ]; then
          echo "ABSENT {{ p }}"
        elif touch "{{ a8_repo_dir }}/{{ p }}/.a8probe" 2>/dev/null; then
          rm -f "{{ a8_repo_dir }}/{{ p }}/.a8probe"; echo "WRITABLE {{ p }}"
        else
          echo "RO {{ p }}"
        fi
        {% endfor %}
        touch "{{ a8_container_home }}/.a8probe" && rm -f "{{ a8_container_home }}/.a8probe" && echo CONTROL_WRITABLE
  register: a8_v_ro
  changed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V12b — every forbidden path is read-only, control path is writable
  ansible.builtin.assert:
    that:
      - "'WRITABLE ' not in a8_v_ro.stdout"
      - "'RO ' in a8_v_ro.stdout"
      - "'CONTROL_WRITABLE' in a8_v_ro.stdout"
    fail_msg: "Монтування в контейнері: {{ a8_v_ro.stdout | replace('\n', ' ') }}"
    success_msg: "{{ a8_v_ro.stdout | replace('\n', ' ') }}"
    quiet: true

# ─── V13. Python для uv запінено ───────────────────────────────────────────
- name: V13a — read UV_PYTHON inside the container
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - printenv
      - UV_PYTHON
  register: a8_v_uvpy
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V13b — uv will pick the pinned Python
  # МЕЖА: доводить, що пін ДОХОДИТЬ до контейнера, а не що `uv sync` проходить —
  # uv в образі node:22 не встановлений роллю, і повний sync — задача демона.
  ansible.builtin.assert:
    that:
      - a8_v_uvpy.stdout | trim == a8_python_version
    fail_msg: "UV_PYTHON у контейнері = '{{ a8_v_uvpy.stdout | trim }}', очікувалось {{ a8_python_version }} (М-3: на 3.14 uv sync падає)"
    quiet: true

# ─── V14. Демон черги: встановлено те, що доведено в CI, таймер як у змінній ─
- name: V14a — checksum of the installed decision logic
  ansible.builtin.stat:
    path: /usr/local/lib/a8/a8-tick-logic.sh
    checksum_algorithm: sha256
  register: a8_v_logic

- name: V14b — checksum of the decision logic in the repository
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../tools/scripts/a8-tick-logic.sh"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: a8_v_logic_repo

- name: V14c — tick installed, timer state matches a8_tick_timer_enabled
  ansible.builtin.shell: |
    set -o pipefail
    test -x /usr/local/bin/a8-tick && echo TICK_PRESENT || echo TICK_MISSING
    systemctl is-enabled a8-tick.timer 2>/dev/null || true
  register: a8_v_tick
  changed_when: false

- name: V14d — logic on A8 is byte-identical to the tested copy; timer as configured
  # Контрольна сума — не формальність: тест у CI доводить файл із репозиторію.
  # Якщо на A8 лежить інша копія, зелений CI нічого не каже про те, що працює.
  ansible.builtin.assert:
    that:
      - a8_v_logic.stat.exists
      - a8_v_logic.stat.checksum == a8_v_logic_repo.stat.checksum
      - "'TICK_PRESENT' in a8_v_tick.stdout"
      - "('enabled' in a8_v_tick.stdout_lines) == (a8_tick_timer_enabled | bool)"
    fail_msg: >-
      logic sha256 A8={{ a8_v_logic.stat.checksum | default('—') }} repo={{ a8_v_logic_repo.stat.checksum }};
      tick/timer: {{ a8_v_tick.stdout | replace('\n', ' ') }}; очікувано enabled={{ a8_tick_timer_enabled }}
    quiet: true

# ─── V15. Образ агента: claude і uv справді є в контейнері ─────────────────
- name: V15a — ask the container for claude, uv and pnpm versions
  # `pnpm --version` — не для повноти списку. Без pnpm у PATH перший же крок
  # тіку падає, і падає оманливо: entrypoint node:22 підставляє `node` перед
  # невідомою командою, тож `pnpm install` стає `node pnpm install`, а node
  # шукає файл `pnpm` у робочій теці. Перший тік на A8 (2026-09-19, задача
  # log-pr116) дав саме це: Cannot find module '…/hart-wt/log-pr116/pnpm'.
  # Тут воно ловиться до задачі, а не задачею.
  ansible.builtin.command:
    argv:
      - /usr/local/bin/a8-run-agent
      - "{{ a8_repo_dir }}"
      - bash
      - -c
      - claude --version; uv --version; pnpm --version
  register: a8_v_image
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V15b — container runs the pinned claude-code, uv and pnpm
  # Доводить, що демону є ЧИМ запускати агента. Не доводить, що агент
  # автентифікується: токен і мережа — окрема перевірка першого ручного тіку.
  ansible.builtin.assert:
    that:
      - a8_v_image.rc == 0
      - a8_claude_code_version in a8_v_image.stdout
      - a8_uv_version in a8_v_image.stdout
      - a8_pnpm_version in a8_v_image.stdout
    fail_msg: "Контейнер {{ a8_container_image }}: rc={{ a8_v_image.rc }}, '{{ a8_v_image.stdout }} {{ a8_v_image.stderr }}'"
    quiet: true

# ─── V18. Оракул воркера CadQuery проходить у контейнері ───────────────────
# Поведінка, а не стан: у свіжому worktree, у справжньому контейнері, після
# `uv sync` — рівно та команда, яка на A8 давала rc=2 без системних бібліотек
# (handoff 2026-09-23 §2 п.1: libGL.so.1). V15 доводить, що uv є; інваріант 9
# у check-ansible-a8.sh — що перелік бібліотек не відстає від образу воркера;
# лише V18 доводить, що агент справді може прогнати тести workers/cad.
#
# Worktree одноразовий і прибирається в `always`: verify не має права лишати
# слідів у дереві, з яким працює демон (README §5). Шлях фіксований, тож
# залишок перерваного прогону прибирається перед стартом.
- name: V18 — CadQuery registry test in a throwaway worktree inside the container
  become: true
  become_user: "{{ a8_agent_user }}"
  block:
    - name: V18a — drop a leftover worktree from an interrupted run
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ a8_repo_dir }}"
          - worktree
          - remove
          - --force
          - "{{ a8_worktrees_dir }}/verify-cad"
      changed_when: false
      failed_when: false

    - name: V18b — create a throwaway worktree at origin/main
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ a8_repo_dir }}"
          - worktree
          - add
          - --quiet
          - --detach
          - "{{ a8_worktrees_dir }}/verify-cad"
          - origin/main
      changed_when: false

    - name: V18c — uv sync, then the registry test, inside the container
      # Та сама послідовність, що в тіку (`cd workers/cad && uv sync`), і
      # дослівно оракул із handoff. `tail` у зонді не потрібен: Ansible
      # обріже вивід сам, а rc — єдине, що судить.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/a8-run-agent
          - "{{ a8_worktrees_dir }}/verify-cad"
          - bash
          - -c
          - (cd workers/cad && uv sync --quiet) && uv run --directory workers/cad pytest tests/templates/test_registry.py -q
      register: a8_v_cad
      changed_when: false
      failed_when: false
  always:
    - name: V18d — remove the throwaway worktree
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ a8_repo_dir }}"
          - worktree
          - remove
          - --force
          - "{{ a8_worktrees_dir }}/verify-cad"
      changed_when: false
      failed_when: false

- name: V18e — the worker's registry test passes inside the agent container
  ansible.builtin.assert:
    that:
      - a8_v_cad.rc == 0
    fail_msg: >-
      rc={{ a8_v_cad.rc }} (до правки образу було 2 — бракувало libGL.so.1).
      Хвіст виводу: {{ (a8_v_cad.stdout_lines | default([]))[-5:] | join(' | ') }}
      {{ (a8_v_cad.stderr_lines | default([]))[-5:] | join(' | ') }}
    success_msg: "test_registry.py у контейнері агента: rc=0 — {{ (a8_v_cad.stdout_lines | default(['']))[-1] }}"
    quiet: true

# ─── V16. ssh-вхід лише на читання справді відмовляє ───────────────────────
- name: V16a — feed a write command to a8-ro-shell
  ansible.builtin.command: /usr/local/bin/a8-ro-shell
  environment:
    SSH_ORIGINAL_COMMAND: "touch /tmp/a8-ro-shell-probe"
  register: a8_v_roshell
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ a8_agent_user }}"

- name: V16b — write refused with code 126 and nothing created
  ansible.builtin.stat:
    path: /tmp/a8-ro-shell-probe
  register: a8_v_roshell_probe

- name: V16c — a8-ro-shell refuses writes
  ansible.builtin.assert:
    that:
      - a8_v_roshell.rc == 126
      - "'ВІДХИЛЕНО' in a8_v_roshell.stderr"
      - not a8_v_roshell_probe.stat.exists
    fail_msg: "a8-ro-shell: rc={{ a8_v_roshell.rc }}, stderr={{ a8_v_roshell.stderr }}"
    quiet: true

# ─── V17. Drop-in egress — рівно тоді, коли увімкнено примус ───────────────
- name: V17a — stat the egress drop-in
  ansible.builtin.stat:
    path: /etc/systemd/system/docker.service.d/zz-a8-egress.conf
  register: a8_v_dropin

- name: V17b — drop-in present if and only if enforcement is on
  ansible.builtin.assert:
    that:
      - a8_v_dropin.stat.exists == ((a8_egress_enabled | bool) and (a8_egress_enforce | bool))
    fail_msg: "drop-in exists={{ a8_v_dropin.stat.exists }}, enforce={{ a8_egress_enforce }}"
    quiet: true

# ─── V11. Креденшал на push — перевіряється НА ДИСКУ ───────────────────────
#
# Раніше це був `debug`, що читав ЗМІННУ. 2026-09-20 перше застосування з
# deploy_key впало («Destination directory /home/agent/.ssh does not exist»),
# ключ не встановився — а V11 одразу після цього бадьоро повідомив «Креденшал
# типу deploy_key встановлено», бо змінну йому передали. Звіт про НАМІР,
# поданий як факт про стан: той самий клас, що ця роль ловить у себе весь час.
#
# ДРУГА РЕДАКЦІЯ ТІЄЇ САМОЇ ВАДИ, 2026-09-20 увечері. Перевірка почала читати
# файл, але ГІЛКУВАЛАСЬ і далі по змінній play'ю. `--tags verify` без `-e`
# брав дефолт і повідомляв «КРЕДЕНШАЛА НА PUSH НЕМАЄ», тоді як у a8.env на
# машині стояло deploy_key і ключ лежав на місці. Перевірка збрехала про стан
# машини, дивлячись на аргумент командного рядка.
#
# Тому нижче вся гілка бере вид креденшала З МАШИНИ. `--tags verify` не
# виконує main.yml, тож факт треба здобути тут, своїм читанням.
- name: V11-pre — read the credential kind the machine is configured with
  ansible.builtin.slurp:
    src: "{{ a8_config_dir }}/a8.env"
  register: a8_v_env
  failed_when: false
  changed_when: false

- name: V11-pre — resolve it
  ansible.builtin.set_fact:
    a8_v_push_kind: >-
      {{ ((a8_v_env.content | default('') | b64decode)
          | regex_findall('(?m)^A8_PUSH_CREDENTIAL_KIND=(\S+)') + ['none']) | first }}

- name: V11a — stat the push credential on disk
  ansible.builtin.stat:
    path: >-
      {{ a8_agent_home ~ '/.ssh/id_push' if a8_v_push_kind == 'deploy_key'
         else a8_config_dir ~ '/push-token' }}
  register: a8_v_cred
  when: a8_v_push_kind != 'none'

- name: V11b — credential file exists with 0600 and belongs to the agent
  ansible.builtin.assert:
    that:
      - a8_v_cred.stat.exists
      - a8_v_cred.stat.mode == "0600"
      - a8_v_cred.stat.pw_name == a8_agent_user
    fail_msg: >-
      a8_v_push_kind={{ a8_v_push_kind }}, але файла креденшала
      на диску немає або права не ті (exists={{ a8_v_cred.stat.exists | default(false) }},
      mode={{ a8_v_cred.stat.mode | default('—') }}).
      Найчастіша причина: застосування впало на задачі встановлення ключа, і play
      обірвався ПОСЕРЕДИНІ — `a8.env` уже містить kind={{ a8_v_push_kind }},
      а ключа немає. Демон у такому стані піде в гілку deploy_key і впаде на push.
      Лікування: повторити apply і переконатись, що PLAY RECAP дає failed=0.
    success_msg: "Креденшал {{ a8_v_push_kind }} на диску, 0600, власник {{ a8_agent_user }}"
    quiet: true
  when: a8_v_push_kind != 'none'

- name: V11c — say out loud when there is no credential at all
  ansible.builtin.debug:
    msg: >-
      КРЕДЕНШАЛА НА PUSH НЕМАЄ (a8_v_push_kind=none). Демон зможе робити
      worktree, commit, fetch, rebase — і НЕ зможе віддати результат: push впаде 128
      на автентифікації (вимір №7). Це не дефект ролі: створення креденшала —
      незворотна дія в акаунті yurii, питання класу A, issue #78.
  when: a8_v_push_kind == 'none'

- name: V11c-bis — authenticate to GitHub with the deploy key, exactly as the tick does
  # ПОВЕДІНКА, не наявність файлів. V11b доводить, що ключ лежить на місці;
  # це не означає, що ним можна користуватись. 2026-09-20 саме так і вийшло:
  # ключ стояв, права правильні, а push падав на `Host key verification failed`,
  # бо в щойно створеній .ssh не було known_hosts.
  #
  # Прапорці — ДОСЛІВНО ті, що в a8-tick (гілка deploy_key). Інакше перевірка
  # доводила б щось інше, ніж робить демон. BatchMode=yes тут несучий: саме він
  # забороняє інтерактивний запит і перетворює відсутній known_hosts на відмову.
  #
  # `ssh -T git@github.com` віддає rc=1 НАВІТЬ при успіху («does not provide
  # shell access»), тому вердикт читається з тексту, а не з коду виходу.
  ansible.builtin.command:
    argv:
      - sudo
      - -n
      - -u
      - "{{ a8_agent_user }}"
      - ssh
      - -i
      - "{{ a8_agent_home }}/.ssh/id_push"
      - -o
      - IdentitiesOnly=yes
      - -o
      - BatchMode=yes
      - -T
      - git@github.com
  register: a8_v_ssh
  changed_when: false
  failed_when: false
  when: a8_v_push_kind == 'deploy_key'

- name: V11c-ter — GitHub recognises the key and the host is trusted
  ansible.builtin.assert:
    that:
      - "'successfully authenticated' in (a8_v_ssh.stderr | default('')) ~ (a8_v_ssh.stdout | default(''))"
    fail_msg: >-
      Ключем {{ a8_agent_home }}/.ssh/id_push автентифікуватись у GitHub НЕ вдалось.
      Дослівно: {{ (a8_v_ssh.stderr | default('')) ~ ' ' ~ (a8_v_ssh.stdout | default('')) }}
      Читати так: «Host key verification failed» — немає або зіпсований
      {{ a8_agent_home }}/.ssh/known_hosts; «Permission denied (publickey)» — ключ не той,
      що зареєстрований у Deploy keys, або права не 0600.
      Доки ця перевірка червона, демон доходитиме до push і падатиме з detail=push.
    success_msg: "GitHub упізнав ключ, хост довірений — push демона має пройти"
    quiet: true
  when: a8_v_push_kind == 'deploy_key'

- name: V11d — remind what the credential can reach
  # Стан branch protection роль перевірити НЕ може: це GitHub, не машина. Тому
  # тут не стверджуємо значення `enforce_admins`, а даємо команду, якою його
  # видно. Попередня редакція писала «enforce_admins=false» як факт — і застаріла
  # того ж дня, коли yurii увімкнув його (2026-09-20).
  ansible.builtin.debug:
    msg: >-
      Креденшал типу {{ a8_v_push_kind }} активний. Що він може на боці
      GitHub — роль не знає і не перевіряє. Подивитись:
      `gh api repos/stjurik/flatcraft/branches/main/protection --jq
      '{approvals: .required_pull_request_reviews.required_approving_review_count,
      admins: .enforce_admins.enabled}'`.
      Ключ розгортання адміністратором НЕ є, тож захист main на нього діє;
      токен, що працює іменем адміністратора, — інша річ (вимір №7).
  when: a8_v_push_kind != 'none'
