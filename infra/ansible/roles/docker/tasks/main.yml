---
# Встановлення Docker Engine + compose plugin з офіційного Debian repo.

- name: Install Docker apt key
  # Чому з ASCII-armored (.asc): новий шлях з docker docs (Debian 12+);
  # бінарний .gpg ще приймається але deprecated.
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
    state: present
    filename: docker
    update_cache: true

- name: Install Docker Engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - docker-buildx-plugin
    state: present

- name: Configure docker daemon (логи з ротацією — не з'їдає 40 GB диск)
  # Чому: docker default `json-file` без обмеження → один балакучий контейнер
  # за тиждень з'їдає весь диск. 10MB × 3 files = 30MB cap на сервіс.
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "live-restore": true
      }
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  # Чому: deploy має робити `docker compose` без sudo для re-deploy. Це
  # фактично root-equivalent (через docker exec); ризик прийнятий для staging.
  ansible.builtin.user:
    name: "{{ app_user }}"
    groups: docker
    append: true

# ─── GHCR login — НЕ обов'язковий, доки образи публічні ────────────────────
# Було «для приватних flatcraft-* образів» — станом на 2026-09-17 це неправда:
# `ghcr.io/stjurik/flatcraft-{api,web,cad-worker}` читаються анонімно, бо
# виконання D.1 (ADR-038, репо → private) відкладено рішенням OQ-30. Логін
# лишається, щоб середовище пережило перехід у private без правок, але
# **перестає бути фатальним**: протермінований PAT не має права валити
# провізіонінг машини, яка й без нього чудово тягне образи.
#
# Прямий наслідок інциденту 2026-09-14…17 (див. роль `flatcraft`, крок 3b):
# саме мовчазне протермінування цього токена зупинило три deploy'ї підряд.
- name: Docker login до ghcr.io (root) — знадобиться, якщо образи стануть приватними
  # Чому запис саме у /root/.docker/config.json: docker compose pull на
  # root-systemd-сервісі (якщо колись з'явиться) бачитиме credentials.
  # Для deploy-user логін окремий нижче.
  ansible.builtin.command:
    cmd: "docker login ghcr.io -u {{ vault_ghcr_username }} --password-stdin"
    stdin: "{{ vault_ghcr_token }}"
  register: docker_ghcr_login_root
  changed_when: "'Login Succeeded' in docker_ghcr_login_root.stdout"
  failed_when: false
  no_log: true # ховаємо токен з viewer'а

- name: Docker login до ghcr.io для deploy-user
  ansible.builtin.command:
    cmd: "docker login ghcr.io -u {{ vault_ghcr_username }} --password-stdin"
    stdin: "{{ vault_ghcr_token }}"
  become: true
  become_user: "{{ app_user }}"
  register: docker_ghcr_login_deploy
  changed_when: "'Login Succeeded' in docker_ghcr_login_deploy.stdout"
  failed_when: false
  no_log: true

- name: Попередити, якщо GHCR-логін не вдався
  # Без цього `failed_when: false` перетворює відмову на тишу — рівно той клас,
  # що вже коштував трьох deploy'їв. Провізіонінг іде далі, але слід у логу є.
  ansible.builtin.debug:
    msg: >-
      GHCR login не вдався (root rc={{ docker_ghcr_login_root.rc | default('n/a') }},
      deploy rc={{ docker_ghcr_login_deploy.rc | default('n/a') }}).
      Доки образи публічні — це не блокер: pull піде анонімно, а роль `flatcraft`
      (крок 3b) прибере непрацездатний креденшал. Перед переходом у private
      (D.1, ADR-038) оновіть `vault_ghcr_token`.
  when: >-
    docker_ghcr_login_root.rc | default(0) != 0
    or docker_ghcr_login_deploy.rc | default(0) != 0
