---
# Намір для МАШИНИ A8 — те, що на ній уже доведено і має лишатися увімкненим.
#
# ЧОМУ ЦЕЙ ФАЙЛ ІСНУЄ. Обидва перемикачі нижче вмикалися прапорцем `-e` на
# застосуванні. `-e` живе рівно один запуск, тож стан машини існував лише як
# команда, яку хтось колись набрав у терміналі, — а це та сама «конфігурація,
# якої немає в git» з CLAUDE.md §0 п.5, проти якої написана вся роль. Гірше:
# наступне застосування БЕЗ прапорців мовчки повернуло б дефолти й зняло і
# фільтр, і таймер, лишивши зелений PLAY RECAP.
#
# ЧОМУ НЕ ЗМІНИТИ ДЕФОЛТИ РОЛІ. Бо вони обслуговують інше питання — підйом
# ЧИСТОЇ машини, де нічого ще не перевірено. Аргумент README §6 («увімкнути
# мережевий фільтр наосліп означає ризикнути тим, що демон тихо втратить
# мережу») там лишається чинним. Дефолти консервативні, а цей файл каже, що
# саме на ЦІЙ машині вже виміряно.
#
# ПОРЯДОК ПЕРЕВАГИ, перевірений прогоном, а не взятий із пам'яті:
#   defaults ролі   → false
#   + group_vars    → true      (перекриває дефолт)
#   + -e            → значення з -e (перекриває все)
# Тобто `-e` лишається тим, чим має бути: РАЗОВИМ аварійним перекриттям.
# Треба терміново зняти фільтр і подивитись, що зміниться, —
# `-e a8_egress_enforce=false` на один запуск, без коміту.

# Примус egress. Доведено 2026-09-21 із контролем ДО/ПІСЛЯ: дозволений
# github.com відповідає, недозволений example.com з 200 стає таймаутом;
# правила стоять одразу після stateful RETURN; переживають і рестарт docker,
# і повне завантаження машини (README §6).
a8_egress_enforce: true

# Таймер демона черги. Доведено 2026-09-21: 26 тіків по ~10 хв, серед них
# ребут після встановлення планки пам'яті — таймер піднявся сам
# (OnBootSec=10min) і продовжив. При порожній черзі тік нічого не пише в
# журнал, тож доказ дає лічильник стартів сервісу, а не runs.log.
a8_tick_timer_enabled: true
