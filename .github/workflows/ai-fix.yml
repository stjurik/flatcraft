# AI bugfix flow v2 — Стадія 2/2: Фікс (ADR-035, docs/promts/master-ai-bugfix-flow.md).
#
# Тригер — ЛИШЕ лейбл `ai-approved`, який yurii ставить ПІСЛЯ читання
# триаж-плану (ai-triage.yml). Двостадійність — свідома пауза для approve
# (ADR-035 §2).
#
# Заборонені шляхи (ADR-035 §5.4) захищені ДВІЧІ:
#   1. `settings` permissions.deny — механічно блокує Edit/Write tool-виклики
#      Claude на цих шляхах ПІД ЧАС виконання.
#   2. verification-step (tools/scripts/check-forbidden-paths.sh) — backstop
#      ПІСЛЯ виконання, ловить обхід через Bash (напр. `echo x > infra/y`),
#      валить job, якщо deny-rule не спрацювала.
name: AI fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # обов'язково для OIDC-обміну claude-code-action (не запис у репо)

concurrency:
  group: ai-fix-${{ github.event.issue.number }}
  cancel-in-progress: true

# Ті самі версії, що в ci.yml — щоб Будівельник збирав те саме, що потім перевіряє CI.
# NODE_VERSION 20→22 свідомо НЕ чіпаємо тут: це окремий пункт черги T1, робиться
# разом з оновленням залежностей (docs/02).
env:
  NODE_VERSION: "20.11.0"
  PNPM_VERSION: "9.12.0"

jobs:
  fix:
    # Другий гейт до лейбла — лейбл `ai-approved` мусить поставити ВЛАСНИК.
    # Порівняння з `github.repository_owner`, не з зашитим логіном: у чернетці
    # `ai-cloud-developer.yml` стояло `== 'jstovbun'` (пошта, а не логін
    # `stjurik`), тобто гейт не спрацював би жодного разу й лишився б непоміченим.
    if: >-
      github.event.label.name == 'ai-approved' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Дослівно з job `test` у ci.yml: без БД Будівельник не прожене *.int.test.ts.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flatcraft
          POSTGRES_PASSWORD: flatcraft_ci_only
          POSTGRES_DB: flatcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flatcraft -d flatcraft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flatcraft:flatcraft_ci_only@localhost:5432/flatcraft
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # потрібна повна історія для git merge-base/diff нижче

      - name: Create fix branch (merge-base guard, docs/16 §3 крок 0)
        run: |
          git fetch origin main
          git checkout -b "fix/issue-${{ github.event.issue.number }}" origin/main

      # Toolchain ДО Claude. Без node_modules Будівельник фізично не міг прогнати
      # тести, які сам написав, — і доказ «червоний до фікса» відтворював РУКАМИ
      # рев'юер (docs/17 §9, ai-review-local.md крок 2-bis). Патерн скопійовано
      # дослівно з ci.yml (jobs `install` і `python`), щоб середовища не розходились.
      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.13"
          enable-cache: true
      - name: Setup Python + CAD worker deps
        working-directory: workers/cad
        run: |
          uv python install 3.12
          uv sync --extra dev

      # Базовий прогін ДО агента. Без нього будь-яке падіння нижче читається як
      # «агент зламав», хоча `main` міг приїхати вже червоним — саме так три дні
      # (14–17.09) виглядав зламаний деплой. Крок розділяє ці два випадки, і
      # `::error::` тут означає «не починай, проблема не в агенті».
      - name: Baseline — чи здоровий main ДО агента
        run: |
          set -o pipefail
          if ! pnpm typecheck; then
            echo "::error::typecheck червоний ЩЕ ДО агента — проблема в main, не у фіксі"
            exit 1
          fi
          if ! pnpm test; then
            echo "::error::unit-тести червоні ЩЕ ДО агента — проблема в main, не у фіксі"
            exit 1
          fi

      - name: Claude fix
        # Pinned SHA — та сама причина, що в ai-triage.yml (ADR-035 §5.3).
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183 (2026-07-25)
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --max-turns 150
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git:*),Bash(gh:*),Bash(pnpm:*),Bash(uv:*)"
          # Механічна заборона (ADR-035 §5.4, лінія 1) — паритетна зі списком
          # у промпті нижче. Синтаксис — той самий permissions.deny формат,
          # що docs/16_AUTONOMOUS_RUNS.md §1 використовує для локальних
          # автономних прогонів (deny має пріоритет над allow).
          settings: |
            {
              "permissions": {
                "deny": [
                  "Edit(packages/db/src/migrations/**)",
                  "Write(packages/db/src/migrations/**)",
                  "Edit(infra/**)",
                  "Write(infra/**)",
                  "Edit(.github/**)",
                  "Write(.github/**)",
                  "Edit(CLAUDE.md)",
                  "Write(CLAUDE.md)",
                  "Edit(docs/03_DECISIONS.md)",
                  "Write(docs/03_DECISIONS.md)",
                  "Edit(docs/12_TEMPLATE_CONTRACT.md)",
                  "Write(docs/12_TEMPLATE_CONTRACT.md)",
                  "Edit(packages/db/src/schema.ts)",
                  "Write(packages/db/src/schema.ts)",
                  "Edit(workers/cad/tests/snapshots/**)",
                  "Write(workers/cad/tests/snapshots/**)",
                  "Bash(git push --force:*)",
                  "Bash(docker:*)",
                  "Bash(pnpm discord:apply:*)"
                ]
              }
            }
          # ЛИШЕ номер issue (безпечне ціле число) інтерполюється у workflow.
          # Заборонені шляхи дослівно з ADR-035 §5.4/промпту — Claude має
          # СПОЧАТКУ перевірити план проти цього списку, а не з'ясовувати
          # постфактум через помилку deny-rule.
          prompt: |
            Ти — Будівельник (роль ADR-036 §3 / docs/15 §0), фіксиш issue
            #${{ github.event.issue.number }} за планом, затвердженим yurii
            (лейбл ai-approved поставлено ПІСЛЯ читання твого триаж-коментаря
            з ai-triage.yml). Ти вже на гілці `fix/issue-${{ github.event.issue.number }}`
            (створена зі свіжого origin/main, merge-base guard уже виконано).
            Headless, без діалогу — увесь результат = PR + коментарі.

            КРОК 1 — прочитай контекст:
            - `gh issue view ${{ github.event.issue.number }} --json title,body,comments,url`
              (в comments — твій же триаж-план з попередньої стадії, читай
              його як затверджений ПЛАН, не вигадуй новий підхід без причини)
            - CLAUDE.md §7, релевантні ADR (docs/03_DECISIONS.md)

            ЗАБОРОНЕНІ ШЛЯХИ (НЕ торкайся; якщо план ЦЬОГО вимагає — СТОП,
            дивись «Якщо заблокований» нижче, замість спроби обійти):
              packages/db/src/migrations/**, infra/**, .github/**, CLAUDE.md,
              docs/03_DECISIONS.md, docs/12_TEMPLATE_CONTRACT.md,
              packages/db/src/schema.ts, workers/cad/tests/snapshots/**
            (Ці шляхи ТАКОЖ заблоковано механічно через permissions.deny —
            якщо Edit/Write на них впаде з permission-error, це очікувано,
            не баг; переходь одразу до «Якщо заблокований».)

            КРОК 2 — TDD за планом: тест (red) → код (green) → рефактор.
            Регресійний тест — ОБОВ'ЯЗКОВИЙ (культура 2.10.e): він мусить
            падати ДО фікса і проходити ПІСЛЯ.

            Оточення вже готове ДО тебе: `node_modules` встановлено
            (`pnpm install --frozen-lockfile`), `uv sync` у workers/cad зроблено,
            Postgres піднято і `DATABASE_URL` заданий. Тобто тести МОЖНА і ТРЕБА
            справді проганяти (AGENTS.md — команди по workspace), а не описувати
            словами, що ти їх прогнав.

            Порядок саме такий: СПОЧАТКУ напиши тест і переконайся, що він
            ПАДАЄ на поточному коді, ПОТІМ фікси. Це перевіряється МАШИННО після
            тебе (`tools/scripts/prove-red-before-green.sh`): твої нові тести
            накладуть на origin/main і проженуть. Тест, який там ЗЕЛЕНИЙ, означає,
            що він не ловить баг, заради якого написаний, — job впаде, і PR
            доведеться переробляти. Тест, якого немає, — так само провал.

            КРОК 3 — коміт (Conventional Commits) → push гілки →
            `gh pr create --draft --base main --title "fix(issue-${{ github.event.issue.number }}): <короткий опис>" --body "<план з триажу, посилання Closes #${{ github.event.issue.number }}, розділ «Як перевірити очима», розділ «Опитування» якщо лишились варіанти>"`.

            КРОК 4 — фінальний коментар у щойно створений PR:
            `gh pr comment <PR-номер> --body "Готово до локального рев'ю: docs/promts/ai-review-local.md"`

            Якщо заблокований (потрібен заборонений шлях АБО план виявився
            хибним/архітектурним просто зараз):
            1. `gh issue comment ${{ github.event.issue.number }} --body "<чому заблоковано, який шлях/причина>"`
            2. `gh issue edit ${{ github.event.issue.number }} --add-label ai-architectural --remove-label ai-approved`
            3. СТОП — НЕ створюй PR у цьому випадку.

      # Машинний доказ регресійного тесту. Замінює ручний крок рев'юера
      # (ai-review-local.md крок 2-bis): тест, що не падає на origin/main, як
      # регресійний нічого не вартий, і job це ловить сам.
      - name: Prove red-before-green (регресійний тест справді ловить баг)
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tools/scripts/prove-red-before-green.sh

      - name: Verify forbidden paths untouched (ADR-035 §5.4, backstop)
        if: always()
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tools/scripts/check-forbidden-paths.sh

      # Прапорець дрейфу CAD-виходів (CLAUDE.md §2.4, ADR-024). Зміна снапшота
      # або експортованого креслення — це зміна того, що замовник отримає на
      # виробництві. Не валимо job: буває легітимна регенерація. Але мовчки
      # пропустити таку зміну не можна — рев'юер мусить її побачити.
      - name: Прапорець дрейфу CAD-виходів
        if: always()
        run: |
          git fetch origin main
          drift=$(git diff --name-only origin/main...HEAD \
                  | grep -E '\.(dxf|pdf)$|snapshots/' || true)
          if [ -n "$drift" ]; then
            echo "::warning::PR зачіпає CAD-виходи — потрібна ручна перевірка байт-детермінізму (CLAUDE.md §2.4):"
            echo "$drift"
          else
            echo "CAD-виходи не зачеплені"
          fi

      # Сигнал про падіння — див. пояснення в ai-triage.yml.
      - name: Сповістити про падіння
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_OPS_WEBHOOK не задано — сповіщення не надіслано"
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"content":"❌ **AI fix** впав — issue #%s\n%s"}' \
                  "${{ github.event.issue.number }}" \
                  "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")" \
            > /dev/null
